<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" fill="none" role="img" aria-label="Tencent Cloud AIGate architecture">
  <style>
    .t { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
    .card-title { font-size: 19px; font-weight: 700; fill: #0F172A; }
    .item { font-size: 15px; fill: #475569; }
    .chip { font-size: 14px; fill: #0F172A; }
    .muted { font-size: 13px; fill: #64748B; }
    .accent { font-size: 13px; fill: #0052D9; font-weight: 600; }
  </style>

  <!-- left: clients -->
  <rect x="24" y="104" width="252" height="192" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="48" y="146" class="t card-title">Clients</text>
  <circle cx="52" cy="178" r="3.5" fill="#0052D9"/>
  <text x="66" y="183" class="t item">OpenAI SDK</text>
  <circle cx="52" cy="208" r="3.5" fill="#0052D9"/>
  <text x="66" y="213" class="t item">Anthropic SDK</text>
  <circle cx="52" cy="238" r="3.5" fill="#0052D9"/>
  <text x="66" y="243" class="t item">curl / any HTTP client</text>
  <text x="48" y="276" class="t muted">one sk- key · one base URL</text>

  <!-- arrow 1 -->
  <line x1="284" y1="200" x2="342" y2="200" stroke="#94A3B8" stroke-width="2"/>
  <path d="M342 193 L354 200 L342 207 Z" fill="#94A3B8"/>
  <text x="284" y="184" class="t muted">sk- keys</text>

  <!-- middle: gateway -->
  <rect x="358" y="40" width="484" height="320" rx="18" fill="#F0F6FF" stroke="#BFD7FF" stroke-width="1.5"/>
  <text x="600" y="84" text-anchor="middle" class="t" font-size="23" font-weight="700" fill="#0F172A">Tencent Cloud AIGate</text>
  <text x="600" y="106" text-anchor="middle" class="t muted">one static binary · no web UI</text>

  <g>
    <rect x="378" y="126" width="220" height="42" rx="11" fill="#FFFFFF" stroke="#DBEAFE" stroke-width="1.5"/>
    <circle cx="398" cy="147" r="3.5" fill="#0052D9"/>
    <text x="412" y="152" class="t chip">Auth &amp; key management</text>

    <rect x="610" y="126" width="212" height="42" rx="11" fill="#FFFFFF" stroke="#DBEAFE" stroke-width="1.5"/>
    <circle cx="630" cy="147" r="3.5" fill="#0052D9"/>
    <text x="644" y="152" class="t chip">Model routing &amp; bindings</text>

    <rect x="378" y="180" width="220" height="42" rx="11" fill="#FFFFFF" stroke="#DBEAFE" stroke-width="1.5"/>
    <circle cx="398" cy="201" r="3.5" fill="#0052D9"/>
    <text x="412" y="206" class="t chip">Three-level token quota</text>

    <rect x="610" y="180" width="212" height="42" rx="11" fill="#FFFFFF" stroke="#DBEAFE" stroke-width="1.5"/>
    <circle cx="630" cy="201" r="3.5" fill="#0052D9"/>
    <text x="644" y="206" class="t chip">Usage accounting</text>

    <rect x="378" y="234" width="220" height="42" rx="11" fill="#FFFFFF" stroke="#DBEAFE" stroke-width="1.5"/>
    <circle cx="398" cy="255" r="3.5" fill="#0052D9"/>
    <text x="412" y="260" class="t chip">Webhook events (HMAC)</text>

    <rect x="610" y="234" width="212" height="42" rx="11" fill="#FFFFFF" stroke="#DBEAFE" stroke-width="1.5"/>
    <circle cx="630" cy="255" r="3.5" fill="#0052D9"/>
    <text x="644" y="260" class="t chip">SSRF-hardened egress</text>
  </g>

  <text x="600" y="318" text-anchor="middle" class="t accent">Admin API · User API · SQLite or MySQL</text>

  <!-- arrow 2 -->
  <line x1="854" y1="200" x2="912" y2="200" stroke="#94A3B8" stroke-width="2"/>
  <path d="M912 193 L924 200 L912 207 Z" fill="#94A3B8"/>
  <text x="886" y="177" text-anchor="middle" class="t muted">resolved</text>
  <text x="886" y="193" text-anchor="middle" class="t muted">request</text>

  <!-- right: upstreams -->
  <rect x="926" y="104" width="250" height="192" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="950" y="146" class="t card-title">Upstreams</text>
  <circle cx="954" cy="178" r="3.5" fill="#0052D9"/>
  <text x="968" y="183" class="t item">OpenAI-compatible endpoint</text>
  <circle cx="954" cy="208" r="3.5" fill="#0052D9"/>
  <text x="968" y="213" class="t item">Anthropic Messages API</text>
  <text x="950" y="252" class="t muted">swap or add models</text>
  <text x="950" y="272" class="t muted">without touching clients</text>
</svg>
