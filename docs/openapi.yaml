openapi: 3.0.3

info:
  title: Tencent Cloud AIGate
  version: 0.1.0
  description: |
    Tencent Cloud AIGate 是自托管的 LLM API 网关，纯 API 服务（无 Web UI）。三个平面：

    - **数据面** `/v1/*`：以数据面密钥（`sk-…`）经 `Authorization: Bearer` 鉴权；
      `/v1/messages` 额外接受 `x-api-key` 头（二者并存时 `x-api-key` 优先）。
    - **管理面** `/admin/*`：以 `role=admin` 用户的访问 token（`gk-…`）经 `Authorization: Bearer` 鉴权。
    - **用户面** `/api/user/*`：任意启用用户（`user` / `admin`）的访问 token 均可访问，`user` 角色强制行级隔离到本人。
    - **健康检查** `/healthz`：无需鉴权。

    约定：

    - 所有错误（除 Anthropic 风格的 `/v1/messages`）统一为 `ErrorResponse`，`code` 等于 HTTP 状态码。
    - 请求体上限 1 MiB：超限**直接拒绝、不截断**——数据面 413、管理面/用户面 400，文案均为 `request body too large`；空请求体返回 400。
    - 数据面 `/v1/*` 的上游成功响应体**原样透传**（本文件中的响应 schema 仅示意），
      上游错误状态码与响应体同样原样透传。
    - 数据面 `/v1/messages` 的错误统一为 Anthropic 风格 `AnthropicErrorResponse`。
    - 配额超限返回配置的状态码（默认 429）并带 `Retry-After` 头；`/v1/messages` 用
      `rate_limit_error`，其余数据面路由用 `ErrorResponse`。

tags:
  - name: health
    description: 健康检查（无鉴权）
  - name: data-plane
    description: 数据面（`sk-` 数据面密钥）
  - name: admin
    description: 管理面（`admin` 角色访问 token）
  - name: user
    description: 用户面（本人身份与用量）

servers:
  - url: http://127.0.0.1:8080
    description: 本地默认监听地址

paths:
  /healthz:
    get:
      tags: [health]
      summary: 健康检查
      security: []
      responses:
        '200':
          description: 服务存活
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'

  /v1/chat/completions:
    post:
      tags: [data-plane]
      summary: OpenAI 兼容的对话补全（流式 / 非流式）
      description: |
        把 OpenAI Chat Completions 请求转发给密钥绑定命中的上游模型。
        网关只读取并改写 `model`、`stream`、`max_tokens`、`max_completion_tokens`，其余字段原样转发。

        模型解析：请求显式给出 `model` 时按大小写不敏感匹配（`/`、`:` 与 `-` 等价）命中的启用绑定；
        同名模型存在多个来源时，可用 `provider/model_id` 前缀精确指定来源——前缀既可为 provider 名
        （如 `qcloudlkeap/deepseek-v3.2`），也可为保存绑定时生成的拼接形态 `{provider}-{model_id}`
        （如 `hatchery-glm-4-plus/glm-4-plus`）。显式给出 `model`（含前缀）而未命中时返回 400 且
        **不回退** primary；未给出 `model` 时使用绑定的 `primary`。

        成功的非流式响应与上游状态码、响应体**原样透传**；`stream: true` 时以
        `text/event-stream` 增量返回并以 `data: [DONE]` 收尾。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatCompletionRequest'
      responses:
        '200':
          description: |
            上游的 200 响应（非流式原样透传；流式为 SSE）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatCompletionResponse'
            text/event-stream:
              schema:
                type: string
                description: 'SSE 分片流，以 `data: [DONE]` 结束'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/BodyTooLarge'
        '429':
          $ref: '#/components/responses/QuotaExceeded'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          description: 非流式：无法连接上游（DNS / 连接 / TLS / 超时）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/models:
    get:
      tags: [data-plane]
      summary: 列出密钥可用的模型
      description: |
        以 OpenAI list 格式返回密钥绑定的**启用**模型，按小写 `model_id` 去重。
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 模型列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIModelList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/messages:
    post:
      tags: [data-plane]
      summary: Anthropic Messages 入站（文本 / 工具 / 图片，流式 / 非流式）
      description: |
        Anthropic Messages 原生入站。鉴权接受 `x-api-key: sk-…` 或 `Authorization: Bearer sk-…`，
        两者并存时 `x-api-key` 优先；凭据无效或缺失返回 401 `authentication_error`。

        请求校验：`model` 必填、`max_tokens` 必填且 > 0，否则 400 `invalid_request_error`；
        未知字段忽略（前向兼容）。

        上游按命中模型的 `model_type` 走两条路径：

        - `openai-completions`：请求转换为 OpenAI 格式（`system` → system 消息、图片转 data URI、
          `tool_use`/`tool_result` → `tool_calls`/`role=tool`、`tools`/`tool_choice`/`stop_sequences` 映射），
          响应与流式 SSE 回译为 Anthropic 事件序列
          （`message_start` → `content_block_start` → `content_block_delta`* → `content_block_stop` → `message_delta` → `message_stop`）。
        - `anthropic-messages`：仅替换 `model` 与施加密钥 `max_tokens` 上限，其余字段与上游响应（含 SSE）原样直通。

        复用三级配额（全局 → 模型 → 用户），超限返回 429 + `Retry-After`（`rate_limit_error`），且不访问上游。
      security:
        - bearerAuth: []
        - apiKeyHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnthropicMessagesRequest'
      responses:
        '200':
          description: Anthropic 消息响应（流式时为 Anthropic SSE 事件序列）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnthropicMessagesResponse'
            text/event-stream:
              schema:
                type: string
                description: Anthropic SSE 事件序列，以 `message_stop` 结束
        '400':
          $ref: '#/components/responses/AnthropicBadRequest'
        '401':
          $ref: '#/components/responses/AnthropicUnauthorized'
        '413':
          $ref: '#/components/responses/AnthropicBodyTooLarge'
        '429':
          $ref: '#/components/responses/AnthropicQuotaExceeded'
        '500':
          $ref: '#/components/responses/AnthropicInternalError'
        '502':
          $ref: '#/components/responses/AnthropicUpstreamError'

  /admin/models:
    get:
      tags: [admin]
      summary: 列出全部模型
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 模型列表（无模型时为空数组）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [admin]
      summary: 创建模型
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelCreateRequest'
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Model'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/models/{id}:
    parameters:
      - $ref: '#/components/parameters/PathID'
    get:
      tags: [admin]
      summary: 查询模型
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 模型
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Model'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [admin]
      summary: 局部更新模型
      description: 仅更新请求中出现的字段。`api_key` 仅在非空时生效（空串为 no-op，凭据无法清空）。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelUpdateRequest'
      responses:
        '200':
          description: 更新后的模型
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Model'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [admin]
      summary: 删除模型
      description: 同时清理引用该模型的全部密钥绑定。
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 已删除
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/models/{id}/connectivity:
    parameters:
      - $ref: '#/components/parameters/PathID'
    post:
      tags: [admin]
      summary: 模型连通性测试
      description: |
        以最小请求（单条 user 消息、`max_tokens=1`）探测上游，验证地址可达、凭据有效且模型可调用。

        **探测结果一律以 HTTP 200 返回**，成功/失败体现在 body 的 `ok`：

        - 成功：`{"ok":true,"latency_ms":N}`（毫秒，取整且为正）；
        - 失败：`{"ok":false,"error_kind":"…","message":"…"}`，`error_kind` 为封闭枚举
          `network_unreachable` / `invalid_api_key` / `forbidden` / `rate_limited` /
          `upstream_server` / `upstream_client`。

        出站复用数据面一致的 SSRF 防护；默认严格模式下私网/回环地址会被拦截并归类为
        `network_unreachable`，需要放行时启动加 `-allow-private-upstreams`。

        仅路径 id 非法（400）与模型不存在（404）走统一错误体。
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 探测结果（成功或失败）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectivityResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/credentials:
    get:
      tags: [admin]
      summary: 列出全部凭据
      description: 响应中的 `secrets[].value` 恒为掩码，绝不回显明文。
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 凭据列表（无凭据时为空数组）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [admin]
      summary: 创建凭据
      description: |
        凭据是一组密钥项，被模型的 `credential_id` 引用后在转发时实时解析（不使用快照）。
        密钥项 `key` 必填，`location` 仅支持 `header`（省略/空串按 `header` 处理）；返回 201 且 secrets 为掩码。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialCreateRequest'
      responses:
        '201':
          description: 已创建的凭据（secrets 掩码）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Credential'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/credentials/{id}:
    parameters:
      - $ref: '#/components/parameters/PathID'
    get:
      tags: [admin]
      summary: 读取单个凭据
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 凭据（secrets 掩码）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Credential'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [admin]
      summary: 局部更新凭据
      description: 仅出现的字段被修改；`secrets` 出现时整体替换，不传则保持不变。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialUpdateRequest'
      responses:
        '200':
          description: 更新后的凭据（secrets 掩码）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Credential'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [admin]
      summary: 删除凭据
      description: 仍被模型（`ai_models.credential_id`）引用时返回 409，需先解除引用。
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 已删除
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /admin/keys:
    get:
      tags: [admin]
      summary: 列出全部密钥
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 密钥列表（不含明文 token）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeyList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [admin]
      summary: 创建密钥
      description: 响应中的 `token` 为一次性明文，仅此一次返回。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KeyCreateRequest'
      responses:
        '201':
          description: 已创建（`token` 为一次性明文）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Key'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/keys/{id}:
    parameters:
      - $ref: '#/components/parameters/PathID'
    get:
      tags: [admin]
      summary: 查询密钥
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 密钥（不含明文 token）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Key'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [admin]
      summary: 局部更新密钥
      description: '`bindings` 出现时整体替换（`[]` 清空）；`user_id` 与 `group_id` 不可更新。'
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KeyUpdateRequest'
      responses:
        '200':
          description: 更新后的密钥
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Key'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [admin]
      summary: 删除密钥
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 已删除
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/keys/{id}/rotate:
    parameters:
      - $ref: '#/components/parameters/PathID'
    post:
      tags: [admin]
      summary: 换发密钥
      description: 生成新的 `sk-` 凭据并立即失效旧凭据；绑定与设置保留。
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 换发后的密钥（`token` 为一次性明文）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Key'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/users:
    get:
      tags: [admin]
      summary: 列出全部用户
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 用户列表（不含明文 token）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [admin]
      summary: 创建用户
      description: 响应中的 `token` 为一次性明文访问 token（`gk-…`），仅此一次返回。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
      responses:
        '201':
          description: 已创建（`token` 为一次性明文）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/users/{id}:
    parameters:
      - $ref: '#/components/parameters/PathID'
    put:
      tags: [admin]
      summary: 局部更新用户
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      responses:
        '200':
          description: 更新后的用户
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [admin]
      summary: 删除用户
      description: 级联删除该用户的密钥与绑定；历史用量日志保留。
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 已删除
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/users/{id}/rotate:
    parameters:
      - $ref: '#/components/parameters/PathID'
    post:
      tags: [admin]
      summary: 换发用户访问 token
