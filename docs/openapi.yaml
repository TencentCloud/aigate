  /admin/import:
    post:
      tags: [admin]
      summary: 存量一次性导入（分组 / 用户 / 模型 / 密钥）
      description: |
        按 `user_groups → users → models → keys` 顺序导入，后者的引用可指向本次刚创建的实体。

        幂等键：`user_groups.name`、`users.name`、`models.(provider,model_id)`、`keys.token`（哈希后比较）；
        已存在记 `skipped`，重复导入不产生重复数据。

        单条失败（引用缺失、字段非法、配额规则非法）以 `details[].action=error` 记录并继续处理其余条目；
        请求本身成功即返回 200，逐条结果在 `summary` / `details` 中。

        `dry_run=true` 只返回将执行的动作计划而不写库。

        `keys[].token` 为明文，导入时立即转为哈希与前缀存储；**明文不落库、不出现在响应或日志中**
        （`details[].ref` 仅为展示前缀）。

        导入的用户**不返回**访问 token（内部生成随机 token 后丢弃明文），需要时用
        `POST /admin/users/{id}/rotate` 换发。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportRequest'
      responses:
        '200':
          description: 导入结果（逐条明细）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

