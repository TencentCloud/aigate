    post:
      tags: [user]
      summary: 创建自助密钥
      description: |
        校验顺序：数量上限（`settings.user_key_limit`，默认 5；`0` = 不限，超限 400
        `key limit reached (limit N)`）→ 模型范围（只能绑定该用户名下任意已有密钥出现过的模型，
        否则 400）→ 落库。返回 201 与一次性明文 `sk-` token。
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FilterUserID'
      requestBody:
        required: true
        content:
          application/json:
