services:
  aigate:
    image: ghcr.io/tencentcloud/aigate:0.1.0
    container_name: aigate
    ports:
      - "8080:8080"
    environment:
      AIGATE_INIT_ADMIN_TOKEN: ${AIGATE_INIT_ADMIN_TOKEN:-dev-admin-token}
    volumes:
      - aigate-data:/data
    command:
      - "-db-type"
      - "sqlite"
      - "-db-dsn"
      - "/data/aigate.db"
    restart: unless-stopped

volumes:
  aigate-data:
